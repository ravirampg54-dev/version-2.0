name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: RPG-Todo/package-lock.json

      - name: Install dependencies
        working-directory: RPG-Todo
        run: npm ci

      - name: Sync Capacitor
        working-directory: RPG-Todo
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        working-directory: RPG-Todo/android
        run: ./gradlew assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpg-todo-apk
          path: RPG-Todo/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: RPG Todo v2.0.0
          body: |
            Installable Android APK built automatically from commit `${{ github.sha }}`.

            ## What's new in v2.0
            - 📝 Notes collection
            - ⏱️ Countdown timer &amp; stopwatch
            - ⏰ Recurring alarms with sound, snooze and vibration
            - 🔔 Notifications and alarm permissions

            ## Install
            1. Open this release on your Android phone.
            2. Download **app-debug.apk**.
            3. Tap the file and allow "Install unknown apps" when prompted.
          files: RPG-Todo/android/app/build/outputs/apk/debug/app-debug.apk
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}